<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Monitoramento com Sincronização</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #logo-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 20vh;
      background-color: white; display: flex; align-items: center;
      justify-content: center; z-index: 1000;
    }
    #logo-container img {
      max-height: 90%; max-width: 90%;
    }
    #status {
      position: absolute; top: 20vh; width: 100%;
      background: rgba(255,255,255,0.95); text-align: center;
      font-weight: bold; font-size: 1.1em; padding: 10px;
      z-index: 999;
    }
    #menu {
      position: absolute; top: 25vh; left: 10px;
      background: white; padding: 10px; border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3); z-index: 1000;
    }
    #menu input, #menu textarea { width: 100%; margin: 5px 0; }
  </style>
</head>
<body>
  <div id="logo-container">
    <img id="logo" src="WebAPP_Logo.png" alt="Logo Effatha" />
  </div>
  <div id="status">Carregando mapa...</div>
  <div id="menu">
    <textarea id="observacao" placeholder="Digite uma observação..."></textarea>
    <input type="file" accept="image/*" capture="environment" id="foto" />
    <button onclick="salvarDadosPoligono()">Salvar Dados</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const statusDiv = document.getElementById("status");
    const observacaoInput = document.getElementById("observacao");
    const fotoInput = document.getElementById("foto");

    const username = "5B39C8B553C821E7CDDC6DA64B5BD2EE";
    const password = "F16828DF16314F7119B09A19F31F4924";
    const credentials = btoa(`${username}:${password}`);

    const poligonoLayers = {};
    let hashAtual = null;
    let map;

    function parseWKT(wkt) {
      return wkt.replace("POLYGON((", "").replace("))", "").split(", ").map(p => {
        const [lng, lat] = p.trim().split(" ").map(Number);
        return [lat, lng];
      });
    }

    function salvarPoligonos(poligonos) {
      localStorage.setItem("poligonos", JSON.stringify(poligonos));
    }

    function carregarPoligonosLocais() {
      const dados = localStorage.getItem("poligonos");
      return dados ? JSON.parse(dados) : [];
    }

    function salvarDadosPoligono() {
      if (!hashAtual) return alert("Nenhum polígono selecionado.");
      const texto = observacaoInput.value;
      const imagem = fotoInput.files[0];

      const reader = new FileReader();
      reader.onload = () => {
        const dados = JSON.parse(localStorage.getItem("dados") || "{}");
        dados[hashAtual] = {
          texto,
          imagem: reader.result,
          data: new Date().toISOString()
        };
        localStorage.setItem("dados", JSON.stringify(dados));
        alert("Dados salvos.");
      };
      if (imagem) reader.readAsDataURL(imagem);
      else reader.onload();
    }

    function isInsidePolygon(latlng, vs) {
      let x = latlng.lat, y = latlng.lng;
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i][0], yi = vs[i][1];
        let xj = vs[j][0], yj = vs[j][1];
        let intersect = ((yi > y) !== (yj > y)) &&
                        (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-10) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function verificarSeDentro(latlng, poligonos) {
      for (const area of poligonos) {
        const coords = parseWKT(area.reducedPolygon);
        if (isInsidePolygon(latlng, coords)) {
          hashAtual = area.hash;
          poligonoLayers[area.hash].setStyle({ color: "orange" });
          return;
        }
      }
      hashAtual = null;
      for (const hash in poligonoLayers) {
        poligonoLayers[hash].setStyle({ color: "blue" });
      }
    }

    async function atualizarPoligonosViaAPI() {
      statusDiv.textContent = "Validando certificados de satélites ... aguarde.";
      const lastChange = localStorage.getItem("lastChange") || "2020-01-01T00:00:00.000Z";

      try {
        const res = await fetch("https://maps-hml-treatmentarea.effatha.com.br:4018/TreatmentActivation/Actives", {
          method: "POST",
          headers: {
            "Authorization": `Basic ${credentials}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ version: "1.0.0", lastChange })
        });

        if (!res.ok) throw new Error("Erro HTTP");

        const resultado = await res.json();
        const recebidos = resultado.data || [];
        let locais = carregarPoligonosLocais();

        for (const p of recebidos) {
          const novo = { hash: p.hash, reducedPolygon: p.reducedPolygon };
          const index = locais.findIndex(x => x.hash === p.hash);

          if (p.action === "C") {
            if (index === -1) locais.push(novo);
          } else if (p.action === "U") {
            if (index !== -1) locais[index] = novo;
          } else if (p.action === "D") {
            if (index !== -1) locais.splice(index, 1);
          }
        }

        salvarPoligonos(locais);
        localStorage.setItem("lastChange", new Date().toISOString());
        statusDiv.textContent = `Polígonos existentes: ${locais.length} / Recebidos da API: ${recebidos.length}`;
        return locais;
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "Erro ao validar certificados de satélites.";
        return carregarPoligonosLocais();
      }
    }

    async function init() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      map = L.map("map").setView([-23.66448, -46.52791], 18);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      const areas = await atualizarPoligonosViaAPI();

      for (const area of areas) {
        const coords = parseWKT(area.reducedPolygon);
        const poly = L.polygon(coords, { color: "blue", fillOpacity: 0.3 }).addTo(map);
        poligonoLayers[area.hash] = poly;

        poly.on("contextmenu", function (event) {
          if (!isMobile) {
            event.originalEvent.preventDefault();
            if (confirm("Deseja excluir esta área?")) {
              map.removeLayer(poly);
              delete poligonoLayers[area.hash];
              const locais = carregarPoligonosLocais().filter(p => p.hash !== area.hash);
              salvarPoligonos(locais);
              statusDiv.textContent = `Área removida: ${area.hash}`;
            }
          }
        });
      }

      function atualizarStatus(latlng) {
        verificarSeDentro(latlng, areas);
      }

      if (isMobile && navigator.geolocation) {
        navigator.geolocation.watchPosition(
          pos => {
            const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
            atualizarStatus(latlng);
            L.marker(latlng).addTo(map);
            map.setView(latlng);
          },
          err => console.error(err),
          { enableHighAccuracy: true }
        );
      } else {
        const marker = L.marker([-23.66448, -46.52791], { draggable: true }).addTo(map);
        atualizarStatus(marker.getLatLng());
        marker.on("drag", e => atualizarStatus(e.target.getLatLng()));
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
