<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Monitoramento com Sincronização</title>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<link href="https://luzodantasjr.github.io/webapp-localizacao/" rel="canonical"/>
<link href="/webapp-localizacao/manifest.json" rel="manifest"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #logo-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 20vh;
      background-color: white; display: flex; align-items: center;
      justify-content: center; z-index: 1000; transition: background 0.3s;
    }
    #logo-container img {
      max-height: 90%;
      max-width: 90%;
      transition: filter 0.3s;
    }
    #status {
      position: absolute; top: 20vh; width: 100%;
      background: rgba(255,255,255,0.95); text-align: center;
      font-weight: bold; font-size: 1.1em; padding: 10px;
      z-index: 999;
    }
    .leaflet-control-zoom {
      bottom: 10px !important;
      right: 10px !important;
      top: auto !important;
    }
  </style>
</head>
<body>
<div id="logo-container">
<img alt="Logo Effatha" id="logo" src="WebAPP_Logo.png"/>
</div>
<div id="status">Carregando mapa...</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map", { zoomControl: false }).setView([-23.66448, -46.52791], 16);

const tileLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "Map data © OpenStreetMap contributors",
    errorTileUrl: "fallback-tile.png"
}).addTo(map);

tileLayer.on('load', () => {
    const statusBox = document.getElementById("status");
    if (statusBox) statusBox.textContent = "";
});
</script>
</body>
</html>
