<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="canonical" href="https://luzodantasjr.github.io/webapp-localizacao/">
  <link rel="manifest" href="/webapp-localizacao/manifest.json">
  <title>Monitoramento de Área</title>
</head>
<body>
  <h1>PWA Monitoramento</h1>
  <p>Verificação de instalação.</p>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/webapp-localizacao/service-worker.js')
        .then(reg => console.log('Service Worker registrado:', reg.scope))
        .catch(err => console.error('Erro ao registrar o Service Worker:', err));
    }
  </script>
</body>
</html>
