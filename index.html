<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Monitoramento de Área - Payload Corrigido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #logo-container {
      position: absolute; top: 0; width: 100%; height: 20vh;
      background: white; display: flex; justify-content: center;
      align-items: center; z-index: 1000;
    }
    #logo-container img {
      max-height: 90%; max-width: 90%;
    }
    #status-container {
      position: absolute; top: 20vh; width: 100%;
      background-color: rgba(255,255,255,0.95);
      text-align: center; font-weight: bold; padding: 10px;
      font-size: 1rem; z-index: 999;
    }
    .leaflet-control-zoom {
      position: absolute !important;
      bottom: 10px !important;
      right: 10px !important;
      z-index: 1001;
    }
    .logo-alert-inside {
      background-color: black !important;
    }
    .logo-alert-inside img {
      filter: invert(1);
      animation: blinkLogo 1.6s infinite steps(1, start);
    }
    @keyframes blinkLogo {
      0%, 49.9% { filter: invert(0); }
      50%, 100% { filter: invert(1); }
    }
  </style>
</head>
<body>
  <div id="logo-container"><img src="WebAPP_Logo.png" alt="Logo Effatha" /></div>
  <div id="status-container"><span id="status-text">Carregando polígonos da API...</span></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const username = "5B39C8B553C821E7CDDC6DA64B5BD2EE";
    const password = "F16828DF16314F7119B09A19F31F4924";
    const credentials = btoa(`${username}:${password}`);
    const endpoint = "https://maps-hml-treatmentarea.effatha.com.br:4018/TreatmentActivation/Actives";

    const statusText = document.getElementById("status-text");
    const logoBox = document.getElementById("logo-container");
    let polygons = [];
    let blinkInterval = null;

    function parseWKT(wkt) {
      const coords = wkt.replace("POLYGON((", "").replace("))", "").split(", ");
      return coords.map(pair => {
        const [lng, lat] = pair.trim().split(" ").map(Number);
        return [lat, lng];
      });
    }

    function isInsideAnyPolygon(latlng) {
      for (const polygon of polygons) {
        const latlngs = polygon.getLatLngs()[0].map(p => [p.lat, p.lng]);
        if (pointInPolygon([latlng.lat, latlng.lng], latlngs)) return true;
      }
      return false;
    }

    function pointInPolygon(point, vs) {
      const [x, y] = point;
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const xi = vs[i][0], yi = vs[i][1];
        const xj = vs[j][0], yj = vs[j][1];
        const intersect =
          yi > y !== yj > y &&
          x < ((xj - xi) * (y - yi)) / ((yj - yi) || 1e-10) + xi;
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function updateStatus(latlng) {
      const inside = isInsideAnyPolygon(latlng);
      if (inside) {
        if (!blinkInterval) {
          blinkInterval = setInterval(() => {
            logoBox.classList.toggle("logo-alert-inside");
          }, 800);
        }
      } else {
        clearInterval(blinkInterval);
        blinkInterval = null;
        logoBox.classList.remove("logo-alert-inside");
      }
    }

    async function carregarPoligonos() {
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Authorization": `Basic ${credentials}`,
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            version: "1.0.0",
            lastChange: "2020-01-01T00:00:00.192Z"
          })
        });

        if (!response.ok) throw new Error("Erro: " + response.status);

        const result = await response.json();
        const data = result.data || [];
        localStorage.setItem("poligonos", JSON.stringify(data));
        return data.map(item => parseWKT(item.reducedPolygon));
      } catch (err) {
        const offline = localStorage.getItem("poligonos");
        if (offline) {
          const data = JSON.parse(offline);
          return data.map(item => parseWKT(item.reducedPolygon));
        }
        statusText.textContent = "Erro ao carregar polígonos.";
        return [];
      }
    }

    async function init() {
      const map = L.map("map").setView([-23.66448, -46.52791], 18);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      const areas = await carregarPoligonos();
      polygons = areas.map(coords =>
        L.polygon(coords, {
          color: "blue",
          fillOpacity: 0.2,
          stroke: true
        }).addTo(map)
      );

      statusText.textContent = `${areas.length} áreas carregadas.`;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const preview = location.hostname === "localhost" || location.hostname === "127.0.0.1";

      if (!isMobile || preview) {
        const marker = L.marker([-23.66448, -46.52791], { draggable: true }).addTo(map);
        updateStatus(marker.getLatLng());
        marker.on("drag", e => updateStatus(e.target.getLatLng()));
      } else if (navigator.geolocation) {
        let userMarker = null;
        navigator.geolocation.watchPosition(
          pos => {
            const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
            if (!userMarker) {
              userMarker = L.marker(latlng).addTo(map).bindPopup("Você está aqui").openPopup();
            } else {
              userMarker.setLatLng(latlng);
            }
            map.setView(latlng, 18);
            updateStatus(latlng);
          },
          err => {
            statusText.textContent = "Erro ao obter localização";
          },
          { enableHighAccuracy: true, maximumAge: 1000 }
        );
      } else {
        statusText.textContent = "Geolocalização não suportada";
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
