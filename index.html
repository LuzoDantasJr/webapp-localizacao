<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento com SQLite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #status-container {
      position: absolute; top: 20vh; width: 100%;
      background: rgba(255,255,255,0.95);
      text-align: center; font-weight: bold;
      padding: 12px; font-size: 1.1rem; z-index: 1000;
    }
    .leaflet-control-zoom {
      position: absolute !important;
      bottom: 10px !important;
      right: 10px !important;
      z-index: 1001;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div id="status-container">Carregando...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { CapacitorSQLite, SQLiteConnection } from "https://cdn.jsdelivr.net/npm/@capacitor-community/sqlite@5.0.2/dist/esm/index.js";

    const sqlite = new SQLiteConnection(CapacitorSQLite);
    const statusDiv = document.getElementById("status-container");

    async function inicializarBanco() {
      const dbName = "areasDb";

      const exists = await sqlite.isDatabase(dbName);
      if (!exists.result) {
        const db = await sqlite.createConnection(dbName, false, "no-encryption", 1);
        await db.open();
        await db.execute(`
          CREATE TABLE IF NOT EXISTS areas (
            hash TEXT PRIMARY KEY,
            latitude REAL,
            longitude REAL,
            reducedPolygon TEXT
          );
        `);
        await db.close();
      }
    }

    function parseWKT(wkt) {
      const coords = wkt.replace("POLYGON((", "").replace("))", "").split(", ");
      return coords.map(p => {
        const [lng, lat] = p.trim().split(" ").map(Number);
        return [lat, lng];
      });
    }

    async function carregarDaAPIeAtualizarDB() {
      statusDiv.textContent = "Validando certificados de satélites ... aguarde.";

      const username = "5B39C8B553C821E7CDDC6DA64B5BD2EE";
      const password = "F16828DF16314F7119B09A19F31F4924";
      const credentials = btoa(`${username}:${password}`);

      try {
        const res = await fetch("https://maps-hml-treatmentarea.effatha.com.br:4018/TreatmentActivation/Actives", {
          method: "POST",
          headers: {
            "Authorization": `Basic ${credentials}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            version: "1.0.0",
            lastChange: "2020-01-01T00:00:00.192Z"
          })
        });

        if (!res.ok) throw new Error("Erro ao buscar dados");

        const result = await res.json();
        const data = result.data || [];

        const db = await sqlite.createConnection("areasDb", false, "no-encryption", 1);
        await db.open();

        for (const area of data) {
          const { hash, latitude, longitude, reducedPolygon, action } = area;

          if (action === "C") {
            await db.run("INSERT OR IGNORE INTO areas (hash, latitude, longitude, reducedPolygon) VALUES (?, ?, ?, ?);", [
              hash, latitude, longitude, reducedPolygon
            ]);
          } else if (action === "U") {
            await db.run("UPDATE areas SET latitude = ?, longitude = ?, reducedPolygon = ? WHERE hash = ?;", [
              latitude, longitude, reducedPolygon, hash
            ]);
          } else if (action === "D") {
            await db.run("DELETE FROM areas WHERE hash = ?;", [hash]);
          }
        }

        const queryRes = await db.query("SELECT * FROM areas;");
        await db.close();

        statusDiv.textContent = `${queryRes.values.length} polígonos carregados.`;
        return queryRes.values.map(area => parseWKT(area.reducedPolygon));
      } catch (err) {
        statusDiv.textContent = "Erro ao carregar dados: " + err;
        return [];
      }
    }

    async function iniciar() {
      const map = L.map("map").setView([-23.66448, -46.52791], 18);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      await inicializarBanco();
      const poligonos = await carregarDaAPIeAtualizarDB();

      for (const coords of poligonos) {
        L.polygon(coords, { color: "blue", fillOpacity: 0.2 }).addTo(map);
      }
    }

    window.addEventListener("DOMContentLoaded", iniciar);
  </script>
</body>
</html>
